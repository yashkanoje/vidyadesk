[project]
name = "leadagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "tzdata",
    "fastembed>=0.9",
    "pgvector>=0.5",
    "pypdf>=5",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.8"]
evals = ["langchain-openai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leadagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["model: needs the real embedding model; run with RUN_MODEL_TESTS=1"]
